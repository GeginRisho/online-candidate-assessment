name: assessment-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: assessment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assessment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-assessment_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-assessment_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assessment_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessment_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assessment_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assessment_platform}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - assessment_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessment_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    expose:
      - '3000'
    networks:
      - assessment_network

  nginx:
    image: nginx:1.27-alpine
    container_name: assessment_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - assessment_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  assessment_network:
    driver: bridge
